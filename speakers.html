<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演讲者 - neurochat 神聊 2026</title>
    <style>
        :root {
            --primary: #0a1628;
            --accent: #00d4ff;
            --accent-dim: #0066cc;
            --text: #e8eef4;
            --text-muted: #8fa3b8;
            --card-bg: #111d30;
            --border: #1e3a5f;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #0d2137 50%, #0a1628 100%);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }
        
        h1 {
            font-size: 2em;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: var(--accent);
        }
        
        .back-link {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: var(--card-bg);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        
        .back-link:hover {
            background: var(--border);
        }
        
        h2 {
            font-size: 1.4em;
            color: var(--accent);
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 500;
        }
        
        .speaker {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }
        
        .speaker img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            object-fit: cover;
            background: var(--primary);
            flex-shrink: 0;
        }
        
        .speaker-info h3 {
            color: var(--text);
            font-size: 1.3em;
            margin-bottom: 8px;
        }
        
        .speaker-info .affiliation {
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 10px;
        }
        
        .speaker-info .topic {
            color: var(--accent);
            font-weight: 500;
        }
        
        .placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        @media (max-width: 600px) {
            .speaker {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; 返回首页</a>
        
        <header>
            <h1>演讲者简介</h1>
        </header>
        
        <h2>Keynote</h2>
        
        <div class="speaker">
            <img src="img/people/speakers/placeholder.jpeg" alt="Keynote演讲人">
            <div class="speaker-info">
                <h3>Keynote 演讲人信息待定</h3>
                <p class="affiliation placeholder">[机构待定]</p>
                <p class="topic">报告题目：<span class="placeholder">[题目待定]</span></p>
            </div>
        </div>
        
        <h2>特邀报告人 (Talks)</h2>
        
        <div class="speaker">
            <img src="img/people/speakers/placeholder.jpeg" alt="演讲人1">
            <div class="speaker-info">
                <h3>演讲人信息待定</h3>
                <p class="affiliation placeholder">[机构待定]</p>
                <p class="topic">报告题目：<span class="placeholder">[题目待定]</span></p>
            </div>
        </div>
        
        <div class="speaker">
            <img src="img/people/speakers/placeholder.jpeg" alt="演讲人2">
            <div class="speaker-info">
                <h3>演讲人信息待定</h3>
                <p class="affiliation placeholder">[机构待定]</p>
                <p class="topic">报告题目：<span class="placeholder">[题目待定]</span></p>
            </div>
        </div>
        
        <div class="speaker">
            <img src="img/people/speakers/placeholder.jpeg" alt="演讲人3">
            <div class="speaker-info">
                <h3>演讲人信息待定</h3>
                <p class="affiliation placeholder">[机构待定]</p>
                <p class="topic">报告题目：<span class="placeholder">[题目待定]</span></p>
            </div>
        </div>
        
        <p style="margin-top: 30px; color: var(--text-muted);"><em>更多演讲人信息持续更新中...</em></p>
    </div>
</body>
</html>
